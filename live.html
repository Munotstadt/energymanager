<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Munotstadt Energy · Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#E30613;
    --ink:#1a1a1a;
    --grey-900:#2b2b2b;
    --grey-600:#666;
    --grey-300:#d8d8d8;
    --grey-100:#f4f4f4;
    --bg:#ffffff;
    --radius:6px;
    --panel:#ffffff; --panel-2:#f4f4f4; --border:#d8d8d8;
    --text:#1a1a1a; --text-dim:#666; --text-dim2:#8a8a8a;
    --accent:#E30613; --accent-dim:#fdeceb;
    --green:#1f9d55; --blue:#1f6feb; --amber:#b9770e; --yellow:#d4a900; --purple:#7c3aed; --teal:#0f9b8e;
    --grid:#e8e8e8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Inter',sans-serif; font-size:15px; line-height:1.45;
  }
  .wrap{max-width:1080px; margin:0 auto; padding:24px 20px 60px;}
  header.topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px; border-bottom:2px solid var(--ink);
  }
  header.topbar .brand{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px;}
  header.topbar .brand span{color:var(--red);}
  header.topbar .nav-link{
    text-decoration:none; color:var(--ink); font-size:13px; font-weight:500;
    padding:7px 12px; border-radius:var(--radius); white-space:nowrap;
  }
  header.topbar .nav-link:hover{background:var(--grey-100);}
  header.topbar .nav-link.active{background:var(--ink); color:#fff;}
  header.topbar .nav-links{display:flex; gap:2px;}
  header.topbar .nav-right{display:flex; align-items:center; gap:6px;}
  header.topbar .logout-link{
    text-decoration:none; color:var(--grey-600); font-size:13px; font-weight:500;
    padding:7px 12px; border-radius:var(--radius); white-space:nowrap;
  }
  header.topbar .logout-link:hover{background:var(--grey-100);}

  header.topbar .upload-link{
    text-decoration:none; color:var(--ink); font-size:13px; font-weight:500;
    padding:7px 12px; border-radius:var(--radius); white-space:nowrap;
  }
  header.topbar .upload-link:hover{background:var(--grey-100);}
  header.topbar .settings-link{
    text-decoration:none; color:var(--ink); font-size:13px; font-weight:500;
    padding:7px 12px; border-radius:var(--radius); white-space:nowrap;
  }
  header.topbar .settings-link:hover{background:var(--grey-100);}

  h1{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:1.4rem; margin:0 0 2px;}
  .sub{color:var(--text-dim); font-size:0.85rem; margin-bottom:20px; display:flex; align-items:center; gap:8px;}
  .live-dot{width:8px; height:8px; border-radius:50%; background:var(--green); display:inline-block; box-shadow:0 0 0 0 rgba(31,157,85,.5); animation:pulse 2s infinite;}
  .live-dot.stale{background:var(--amber); animation:none;}
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(31,157,85,.45);}
    70%{box-shadow:0 0 0 6px rgba(31,157,85,0);}
    100%{box-shadow:0 0 0 0 rgba(31,157,85,0);}
  }
  h2{
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:1rem;
    margin:28px 0 10px; color:var(--text);
  }
  h2 .hint{color:var(--text-dim); font-weight:400; font-size:0.78rem; margin-left:6px;}

  .kpi-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:8px;}
  @media(min-width:480px){.kpi-grid{grid-template-columns:repeat(3,1fr);}}
  @media(min-width:760px){.kpi-grid{grid-template-columns:repeat(4,1fr);}}
  .kpi{
    background:var(--bg); border:1px solid var(--grey-300); border-radius:var(--radius);
    padding:14px 16px 12px; border-left:3px solid var(--grey-300);
  }
  .kpi.pv{border-left-color:var(--yellow);}
  .kpi.cons{border-left-color:var(--accent);}
  .kpi.grid-from{border-left-color:var(--amber);}
  .kpi.grid-to{border-left-color:var(--blue);}
  .kpi.batt{border-left-color:var(--purple);}
  .kpi .label{font-size:0.7rem; text-transform:uppercase; letter-spacing:.04em; color:var(--text-dim);}
  .kpi .value{font-family:'IBM Plex Mono',monospace; font-size:1.35rem; font-weight:600; margin-top:4px;}
  .kpi .value small{font-size:0.7rem; color:var(--text-dim); font-weight:400;}
  .kpi .delta{font-size:0.72rem; margin-top:3px; color:var(--text-dim);}
  .kpi .daytotal{font-size:0.68rem; margin-top:2px; color:var(--text-dim2);}

  .card{
    background:var(--bg); border:1px solid var(--grey-300); border-radius:var(--radius);
    padding:16px 18px 12px; margin-bottom:6px;
  }
  .refresh-btn{
    font-family:'Inter',sans-serif; font-weight:600; font-size:13px;
    padding:8px 14px; border-radius:var(--radius); border:1px solid var(--ink);
    background:var(--ink); color:#fff; cursor:pointer; white-space:nowrap;
  }
  .refresh-btn:hover{opacity:.85;}
  .refresh-btn:disabled{opacity:.5; cursor:default;}
  .today-est .kpi .value{font-size:1.1rem;}
  .legend{display:flex; flex-wrap:wrap; gap:12px; margin-bottom:8px; font-size:0.75rem; color:var(--text-dim);}
  .legend .item{display:flex; align-items:center; gap:5px;}
  .legend .sw{width:10px; height:10px; border-radius:2px; display:inline-block;}

  #status{color:var(--text-dim); font-family:'IBM Plex Mono',monospace; font-size:0.82rem; padding:40px 0; text-align:center;}
  .footer{color:var(--text-dim2); font-size:0.72rem; text-align:center; margin-top:30px;}
  a{color:var(--accent);}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">Munotstadt <span>Energy</span></div>
  <div class="nav-right">
    <div class="nav-links">
      <a href="index.html" class="nav-link">Dashboard</a>
      <a href="live.html" class="nav-link active">Live</a>
      <a href="geraete.html" class="nav-link">Geräte</a>
      <a href="car.html" class="nav-link">Auto</a>
    </div>
    <a href="settings.html" class="settings-link">&#9881; Settings</a>
    <a href="/cdn-cgi/access/logout" class="logout-link">Logout</a>
  </div>
</header>
<div class="wrap">
  <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:12px;">
    <div>
      <h1>Live</h1>
      <div class="sub"><span class="live-dot" id="liveDot"></span><span id="subline">Lade Live-Daten...</span></div>
    </div>
    <button class="refresh-btn" id="refreshBtn" onclick="triggerCollectorAndReload()">&#8635; Aktualisieren</button>
  </div>
  <div id="status">Lade Live-Daten...</div>
  <div id="content" style="display:none;">

    <div class="kpi-grid" id="kpiGrid"></div>

    <h2>Heute <span class="hint">geschätzt, bis jetzt &middot; aus Live-Daten hochgerechnet</span></h2>
    <div class="kpi-grid today-est" id="todayEstGrid"></div>

    <h2>Produktion &amp; Verbrauch <span class="hint">letzte 24 Stunden</span></h2>
    <div class="card">
      <div class="legend" id="legendMain"></div>
      <div id="chartMain"></div>
    </div>

    <h2>Geräte <span class="hint">letzte 24 Stunden, aktuelle Leistung</span></h2>
    <div class="card">
      <div class="legend" id="legendDevices"></div>
      <div id="chartDevices"></div>
    </div>

  </div>
  <div class="footer" id="footerInfo"></div>
</div>

<script>
// ---------- Cloudflare Worker API (D1) ----------
const API_URL = "https://api.energy.munot.app/api/data/live";
const REFRESH_MS = 15 * 60 * 1000; // 15 Minuten

const DEVICE_COLORS = ["#E30613","#1f6feb","#1f9d55","#b9770e","#7c3aed","#0f9b8e","#c2185b","#5d4037"];

// Geräte-IDs, die in den Live-Kacheln/Charts nicht angezeigt werden sollen
// (case-insensitiv vergleichen, da device_id in der DB kleingeschrieben ist)
const EXCLUDED_DEVICE_IDS = new Set([
  "65168AB128EC518AFA0F665F",
  "6516885AFD811A3C709C5BC2",
  "68DD100001EB837ABD21B2FD",
  "68DD114AE232D2C6444E11A2",
  "658153DB411180774FE01246",
].map(id => id.toLowerCase()));

function fmt(n, digits=0){
  if (n === null || n === undefined || isNaN(n)) return "–";
  return n.toLocaleString('de-CH', {minimumFractionDigits:digits, maximumFractionDigits:digits});
}
function fmtTime(iso){
  try{
    // gespeichert als UTC-ISO ohne 'Z' -> explizit als UTC parsen
    const d = new Date(iso.endsWith('Z') ? iso : iso + 'Z');
    return d.toLocaleTimeString('de-CH', {hour:'2-digit', minute:'2-digit', timeZone:'Europe/Zurich'});
  } catch(e){ return iso; }
}
function toLocalDate(iso){
  return new Date(iso.endsWith('Z') ? iso : iso + 'Z');
}

async function fetchFromApi(){
  const res = await fetch(API_URL, {cache:"no-store", credentials:"include"});
  if (!res.ok) throw new Error(`API HTTP ${res.status}`);
  const payload = await res.json();

  return {
    points: payload.points || [],
    deviceReadings: (payload.deviceReadings || [])
      .filter(d => !EXCLUDED_DEVICE_IDS.has((d.device_id || '').toLowerCase())),
    deviceNames: payload.deviceNames || {},
    dayTotals: payload.dayTotals || null,
  };
}

// ---------- Mini SVG-Liniendiagramm (keine externe Lib, analog Bar-Chart-Stil) ----------
function renderLineChart(containerId, series, opts={}){
  const el = document.getElementById(containerId);
  const w = el.clientWidth > 0 ? el.clientWidth : 640;
  const h = opts.height || 220;
  const padL = 42, padR = 10, padT = 12, padB = 24;
  const plotW = w - padL - padR, plotH = h - padT - padB;

  let allTimes = [], allVals = [];
  series.forEach(s => s.points.forEach(p => {
    if (p.t !== null && p.t !== undefined) allTimes.push(p.t);
    if (p.v !== null && p.v !== undefined && !isNaN(p.v)) allVals.push(p.v);
  }));
  if (allTimes.length === 0){
    el.innerHTML = `<div style="color:var(--text-dim); font-size:0.85rem; padding:30px 0; text-align:center;">Noch keine Live-Daten in diesem Zeitraum.</div>`;
    return;
  }
  const tMin = Math.min(...allTimes), tMax = Math.max(...allTimes);
  let vMin = Math.min(0, ...allVals), vMax = Math.max(...allVals);
  if (vMax === vMin){ vMax += 1; }
  const vPad = (vMax - vMin) * 0.08;
  vMin -= vPad; vMax += vPad;

  const x = t => padL + (tMax === tMin ? plotW/2 : (t - tMin) / (tMax - tMin) * plotW);
  const y = v => padT + plotH - (v - vMin) / (vMax - vMin) * plotH;

  // Gridlines (y) + Zero-Linie
  const yTicks = 4;
  let gridSvg = '';
  for (let i=0; i<=yTicks; i++){
    const v = vMin + (vMax - vMin) * i / yTicks;
    const yy = y(v);
    gridSvg += `<line x1="${padL}" y1="${yy}" x2="${w-padR}" y2="${yy}" stroke="var(--grid)" stroke-width="1"/>`;
    gridSvg += `<text x="${padL-6}" y="${yy+3}" text-anchor="end" font-size="9.5" font-family="IBM Plex Mono, monospace" fill="var(--text-dim)">${fmt(v,0)}</text>`;
  }
  if (vMin < 0 && vMax > 0){
    gridSvg += `<line x1="${padL}" y1="${y(0)}" x2="${w-padR}" y2="${y(0)}" stroke="var(--grey-600)" stroke-width="1"/>`;
  }

  // x-Achsen-Labels (Uhrzeit)
  const xTicks = 6;
  let xLabels = '';
  for (let i=0; i<=xTicks; i++){
    const t = tMin + (tMax - tMin) * i / xTicks;
    xLabels += `<text x="${x(t)}" y="${h-6}" text-anchor="middle" font-size="9.5" font-family="IBM Plex Mono, monospace" fill="var(--text-dim)">${fmtTime(new Date(t).toISOString())}</text>`;
  }

  let paths = '';
  series.forEach(s => {
    const pts = s.points.filter(p => p.v !== null && p.v !== undefined && !isNaN(p.v));
    if (pts.length === 0) return;
    const d = pts.map((p,i) => `${i===0 ? 'M' : 'L'} ${x(p.t).toFixed(1)} ${y(p.v).toFixed(1)}`).join(' ');
    paths += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  });

  el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" style="display:block; overflow:visible;">
    ${gridSvg}${xLabels}${paths}
  </svg>`;
}

function renderLegend(containerId, series){
  document.getElementById(containerId).innerHTML = series.map(s =>
    `<span class="item"><span class="sw" style="background:${s.color}"></span>${s.label}</span>`
  ).join('');
}

// ---------- KPI-Kacheln ----------
function dayTotalHtml(kwh){
  return kwh !== null && kwh !== undefined ? `<div class="daytotal">Tagestotal: ${fmt(kwh,1)} kWh</div>` : '';
}

function matchDeviceDayTotal(name, dayTotals){
  if (!dayTotals) return null;
  const n = name.toLowerCase();
  if (n.includes('ladestation')) return dayTotals.Ladestation;
  if (n.includes('entfeuchter') || n.includes('waschen')) return dayTotals.Entfeuchter;
  if (n.includes('wasserpumpe')) return dayTotals.Wasserpumpe;
  return null;
}

function renderKpis(latestPoint, latestDeviceByName, dayTotals){
  const cards = [];
  cards.push({cls:'cons', label:'Verbrauch', value: latestPoint ? `${fmt(latestPoint.consumption)} <small>W</small>` : '–',
    daytotal: dayTotalHtml(dayTotals ? dayTotals.consumption : null)});
  cards.push({cls:'pv', label:'PV-Produktion', value: latestPoint ? `${fmt(latestPoint.pv)} <small>W</small>` : '–',
    daytotal: dayTotalHtml(dayTotals ? dayTotals.production : null)});
  if (latestPoint && latestPoint.grid !== null){
    const fromGrid = latestPoint.grid > 0;
    cards.push({cls: fromGrid ? 'grid-from' : 'grid-to', label: fromGrid ? 'Netzbezug' : 'Einspeisung', value: `${fmt(Math.abs(latestPoint.grid))} <small>W</small>`,
      daytotal: dayTotalHtml(dayTotals ? (fromGrid ? dayTotals.gridFrom : dayTotals.gridTo) : null)});
  } else {
    cards.push({cls:'grid-from', label:'Netz', value:'–', daytotal:''});
  }
  Object.entries(latestDeviceByName).forEach(([name, power]) => {
    cards.push({cls:'', label:name, value: `${fmt(power)} <small>W</small>`,
      daytotal: dayTotalHtml(matchDeviceDayTotal(name, dayTotals))});
  });
  document.getElementById('kpiGrid').innerHTML = cards.map(c => `
    <div class="kpi ${c.cls}">
      <div class="label">${c.label}</div>
      <div class="value">${c.value}</div>
      ${c.daytotal}
    </div>
  `).join('');
}

let refreshTimer = null;

// ---------- Heute-Schaetzung aus Live-Punkten (Trapez-Integration) ----------
function estimateTodayFromPoints(points){
  const todayIso = new Intl.DateTimeFormat('en-CA', {timeZone:'Europe/Zurich'}).format(new Date());
  const todays = points
    .filter(p => new Intl.DateTimeFormat('en-CA', {timeZone:'Europe/Zurich'}).format(toLocalDate(p.fetched_at)) === todayIso)
    .slice()
    .sort((a,b) => toLocalDate(a.fetched_at) - toLocalDate(b.fetched_at));

  let consumptionWh = 0, productionWh = 0, gridFromWh = 0, gridToWh = 0;
  for (let i = 1; i < todays.length; i++){
    const prev = todays[i-1], cur = todays[i];
    const hours = (toLocalDate(cur.fetched_at) - toLocalDate(prev.fetched_at)) / 3600000;
    if (hours <= 0 || hours > 1) continue; // Luecken (z.B. Nachtpause) nicht hochrechnen

    if (prev.consumption !== null && cur.consumption !== null){
      consumptionWh += (prev.consumption + cur.consumption) / 2 * hours;
    }
    if (prev.pv !== null && cur.pv !== null){
      productionWh += (prev.pv + cur.pv) / 2 * hours;
    }
    if (prev.grid !== null && cur.grid !== null){
      const avgGrid = (prev.grid + cur.grid) / 2;
      if (avgGrid > 0) gridFromWh += avgGrid * hours;
      else gridToWh += -avgGrid * hours;
    }
  }

  return {
    consumption_kwh: consumptionWh / 1000,
    production_kwh: productionWh / 1000,
    gridFrom_kwh: gridFromWh / 1000,
    gridTo_kwh: gridToWh / 1000,
    n_points: todays.length,
  };
}

function renderTodayEstimate(points){
  const est = estimateTodayFromPoints(points);
  const cards = [
    {cls:'cons', label:'Verbrauch', value:`${fmt(est.consumption_kwh, 1)} <small>kWh</small>`},
    {cls:'pv', label:'Produktion', value:`${fmt(est.production_kwh, 1)} <small>kWh</small>`},
    {cls:'grid-from', label:'Netzbezug', value:`${fmt(est.gridFrom_kwh, 1)} <small>kWh</small>`},
    {cls:'grid-to', label:'Einspeisung', value:`${fmt(est.gridTo_kwh, 1)} <small>kWh</small>`},
  ];
  document.getElementById('todayEstGrid').innerHTML = cards.map(c => `
    <div class="kpi ${c.cls}">
      <div class="label">${c.label}</div>
      <div class="value">${c.value}</div>
    </div>
  `).join('');
}

// ---------- Manuelles Aktualisieren: Collector-Worker antriggern ----------
const COLLECTOR_URL = "https://collector.energy.munot.app/";

async function triggerCollectorAndReload(){
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  const originalLabel = btn.textContent;
  btn.textContent = 'Aktualisiere...';
  try{
    await fetch(COLLECTOR_URL, {cache:'no-store', credentials:'include'});
  } catch(e){
    console.warn('Collector-Trigger fehlgeschlagen (Datenanzeige wird trotzdem neu geladen):', e);
  } finally {
    await load();
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
}

async function load(){
  try{
    const { points, deviceReadings, deviceNames, dayTotals } = await fetchFromApi();

    document.getElementById('status').style.display = 'none';
    document.getElementById('content').style.display = 'block';
    document.getElementById('liveDot').classList.remove('stale');

    const latestPoint = points.length ? points[points.length-1] : null;
    const nowStr = new Date().toLocaleTimeString('de-CH', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    document.getElementById('subline').textContent = latestPoint
      ? `Letzter Datenpunkt: ${fmtTime(latestPoint.fetched_at)} Uhr · aktualisiert ${nowStr}`
      : `Keine Live-Daten in den letzten 12h · aktualisiert ${nowStr}`;
    document.getElementById('footerInfo').textContent = `Datenquelle: energymanager-api (live) · Aktualisierung alle ${REFRESH_MS/60000} Min (Cloudflare Worker Cron)`;

    // Geraete: neuesten Wert je Geraet ermitteln + pro Geraet Zeitreihe bauen
    const byDevice = {};
    deviceReadings.forEach(r => {
      const name = deviceNames[r.device_id] || r.device_id;
      if (!byDevice[name]) byDevice[name] = [];
      byDevice[name].push(r);
    });
    const latestDeviceByName = {};
    Object.entries(byDevice).forEach(([name, arr]) => {
      const last = arr[arr.length-1];
      latestDeviceByName[name] = last ? last.power : null;
    });

    renderKpis(latestPoint, latestDeviceByName, dayTotals);
    renderTodayEstimate(points);

    // Hauptchart: Produktion / Verbrauch / Netzbezug
    const mainSeries = [
      { label:'Produktion', color:'#d4a900', points: points.map(p => ({ t: toLocalDate(p.fetched_at).getTime(), v: p.pv })) },
      { label:'Verbrauch', color:'#E30613', points: points.map(p => ({ t: toLocalDate(p.fetched_at).getTime(), v: p.consumption })) },
      { label:'Netz (+Bezug/-Einspeisung)', color:'#1f9d55', points: points.map(p => ({ t: toLocalDate(p.fetched_at).getTime(), v: p.grid })) },
    ];
    renderLegend('legendMain', mainSeries);
    renderLineChart('chartMain', mainSeries, { height: 240 });

    // Geraete-Chart
    const deviceSeries = Object.entries(byDevice).map(([name, arr], i) => ({
      label: name,
      color: DEVICE_COLORS[i % DEVICE_COLORS.length],
      points: arr.map(r => ({ t: toLocalDate(r.fetched_at).getTime(), v: r.power }))
    }));
    renderLegend('legendDevices', deviceSeries);
    renderLineChart('chartDevices', deviceSeries, { height: 240 });

  } catch(e){
    console.warn("API-Zugriff fehlgeschlagen:", e);
    document.getElementById('liveDot').classList.add('stale');
    if (document.getElementById('content').style.display === 'none'){
      document.getElementById('status').textContent = `Fehler beim Laden: ${e.message}`;
    } else {
      document.getElementById('subline').textContent = `Live-Update fehlgeschlagen (${e.message}) · zeige letzten Stand`;
    }
  }
}

function scheduleRefresh(){
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(load, REFRESH_MS);
}

window.addEventListener('resize', () => {
  // Charts bei Groessenaenderung neu zeichnen (einfachste Loesung: neu laden aus letztem Stand vermeiden -> nur bei Bedarf)
});

load();
scheduleRefresh();
</script>
</body>
</html>
