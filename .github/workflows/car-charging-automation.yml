name: Auto-Ladestation Start-Charging-Automation

on:
  schedule:
    # alle 15 Minuten (UTC)
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  check-and-switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies installieren
        run: pip install -r scripts/requirements-solarmanager-live.txt

      - name: Einspeisung/Netzbezug pruefen und Lademodus ggf. umschalten
        env:
          SM_EMAIL: ${{ secrets.SM_EMAIL }}
          SM_API_KEY_WRITE: ${{ secrets.SM_API_KEY_WRITE }}
          SM_BASE_URL: ${{ vars.SM_BASE_URL }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python scripts/car_charging_automation.py
