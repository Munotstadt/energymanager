# Name entspricht dem bestehenden Worker im Cloudflare-Dashboard (ohne "r")
name = "ekz-dynamic-price-collecto"
main = "src/index.js"
compatibility_date = "2026-09-01"

# 18:00 Zürcher Zeit + Backup 20:00. Crons sind UTC: stündlich 16-19 UTC,
# der Code führt nur zu den Lokalstunden 18 und 20 aus (Sommer 16+18 UTC, Winter 17+19 UTC).
[triggers]
crons = ["0 16-19 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "energy"
database_id = "5dfeb585-9598-41c5-a485-52d2831e4ec2"

# Tarifnamen (per Swagger/Tarifliste prüfen, ohne Code-Änderung anpassbar)
[vars]
ENERGY_TARIFF = "electricity_dynamic"
GRID_TARIFF = "grid_400D_inclFees"
