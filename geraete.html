<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Munotstadt Energy · Geräte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#E30613;
    --ink:#1a1a1a;
    --grey-900:#2b2b2b;
    --grey-600:#666;
    --grey-300:#d8d8d8;
    --grey-100:#f4f4f4;
    --bg:#ffffff;
    --radius:6px;
    --panel:#ffffff; --panel-2:#f4f4f4; --border:#d8d8d8;
    --text:#1a1a1a; --text-dim:#666; --text-dim2:#8a8a8a;
    --accent:#E30613; --accent-dim:#fdeceb;
    --green:#1f9d55; --blue:#1f6feb; --amber:#b9770e; --purple:#7c3aed;
    --grid:#e8e8e8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Inter',sans-serif; font-size:15px; line-height:1.45;
  }
  .wrap{max-width:1080px; margin:0 auto; padding:24px 20px 60px;}
  header.topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px; border-bottom:2px solid var(--ink);
  }
  header.topbar .brand{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:18px;}
  header.topbar .brand span{color:var(--red);}
  header.topbar .nav-link{
    text-decoration:none; color:var(--ink); font-size:13px; font-weight:500;
    padding:7px 12px; border-radius:var(--radius); white-space:nowrap;
  }
  header.topbar .nav-link:hover{background:var(--grey-100);}
  header.topbar .nav-link.active{background:var(--ink); color:#fff;}
  header.topbar .nav-links{display:flex; gap:2px;}
  header.topbar .upload-link{
    text-decoration:none; color:var(--ink); font-size:13px; font-weight:500;
    padding:7px 12px; border-radius:var(--radius); white-space:nowrap;
  }
  header.topbar .upload-link:hover{background:var(--grey-100);}
  header.topbar .settings-link{
    text-decoration:none; color:var(--ink); font-size:13px; font-weight:500;
    padding:7px 12px; border-radius:var(--radius); white-space:nowrap;
  }
  header.topbar .settings-link:hover{background:var(--grey-100);}
  header.topbar .nav-right{display:flex; align-items:center; gap:6px;}
  header.topbar .logout-link{
    text-decoration:none; color:var(--grey-600); font-size:13px; font-weight:500;
    padding:7px 12px; border-radius:var(--radius); white-space:nowrap;
  }
  header.topbar .logout-link:hover{background:var(--grey-100);}


  h1{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:1.4rem; margin:0 0 2px;}
  .sub{color:var(--text-dim); font-size:0.85rem; margin-bottom:20px;}
  h2{
    font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:1rem;
    margin:28px 0 10px; color:var(--text);
  }
  h2 .hint{color:var(--text-dim); font-weight:400; font-size:0.78rem; margin-left:6px;}

  .card{
    background:var(--bg); border:1px solid var(--grey-300); border-radius:var(--radius);
    padding:16px 18px 8px; margin-bottom:6px;
  }

  .tabs{display:inline-flex; gap:0; margin-bottom:10px; flex-wrap:wrap; border:1px solid var(--grey-300); border-radius:var(--radius); overflow:hidden;}
  .tab{
    background:#fff; border:none; border-right:1px solid var(--grey-300); color:var(--ink);
    font-family:'Inter',sans-serif; font-weight:500; font-size:13px; padding:7px 14px;
    cursor:pointer;
  }
  .tab:last-child{border-right:none;}
  .tab.active{background:var(--ink); color:#fff;}
  .tab:hover:not(.active){background:var(--grey-100);}

  table{width:100%; border-collapse:collapse; font-family:'IBM Plex Mono',monospace; font-size:0.78rem;}
  th{
    text-align:right; color:var(--grey-600); font-weight:600; padding:8px 10px;
    border-bottom:1px solid var(--grey-300); font-size:0.68rem; text-transform:uppercase;
    letter-spacing:.03em; white-space:nowrap;
    position:sticky; top:0; background:var(--bg); z-index:1;
  }
  th:first-child, td:first-child{text-align:left;}
  td{text-align:right; padding:8px 10px; border-bottom:1px solid var(--grid); white-space:nowrap;}
  tr:hover td{background:var(--grey-100);}
  tr:last-child td{border-bottom:none;}
  .table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -2px;}
  .table-scroll table{min-width:900px;}
  .table-vscroll{max-height:70vh; overflow-y:auto;}

  #status{color:var(--text-dim); font-family:'IBM Plex Mono',monospace; font-size:0.82rem; padding:40px 0; text-align:center;}
  .footer{color:var(--text-dim2); font-size:0.72rem; text-align:center; margin-top:30px;}
  a{color:var(--accent);}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">Munotstadt <span>Energy</span></div>
  <div class="nav-right">
    <div class="nav-links">
      <a href="index.html" class="nav-link">Dashboard</a>
      <a href="live.html" class="nav-link">Live</a>
      <a href="geraete.html" class="nav-link active">Geräte</a>
      <a href="car.html" class="nav-link">Auto</a>
      <a href="costs.html" class="nav-link">Kosten</a>
    </div>
    <a href="settings.html" class="settings-link">&#9881; Settings</a>
    <a href="/cdn-cgi/access/logout" class="logout-link">Logout</a>
  </div>
</header>
<div class="wrap">
  <div>
    <h1>Geräte · Tagesübersicht</h1>
    <div class="sub" id="subline">Lade Daten...</div>
  </div>
  <div id="status">Lade Daten...</div>
  <div id="content" style="display:none;">

    <h2>Produktion <span class="hint">letzte 30 &amp; nächste 15 Tage · je Vorjahr der letzten 5 Jahre</span></h2>
    <div class="card" style="padding-bottom:14px;">
      <div id="prodChartLegend" style="display:flex; gap:14px; flex-wrap:wrap; margin-bottom:8px; font-size:0.72rem; color:var(--text-dim);"></div>
      <div style="overflow-x:auto; position:relative;">
        <svg id="prodChart" viewBox="0 0 1040 260" style="width:100%; min-width:900px; height:auto; display:block;"></svg>
        <div id="prodChartTooltip" style="position:absolute; display:none; pointer-events:none; background:#1a1a1a; color:#fff; font-family:'IBM Plex Mono',monospace; font-size:11px; padding:5px 8px; border-radius:4px; white-space:nowrap; z-index:5; transform:translate(-50%,-100%);"></div>
      </div>
    </div>

    <div class="tabs" id="rangeTabs">
      <button type="button" class="tab" data-range="30">30T</button>
      <button type="button" class="tab" data-range="90">90T</button>
      <button type="button" class="tab active" data-range="365">365T</button>
    </div>

    <h2>Tagesübersicht <span class="hint">neuster Tag zuoberst</span></h2>
    <div class="card" style="padding-bottom:14px;">
      <div class="table-scroll">
        <div class="table-vscroll">
          <table id="dailyTable"></table>
        </div>
      </div>
    </div>

  </div>
  <div class="footer" id="footerInfo"></div>
</div>

<script>
// ---------- Cloudflare Worker API (D1) ----------
const API_URL = "https://api.energy.munot.app/api/data/solarmanager_data";

const CACHE_KEY = "munotstadt_devices_daily_cache_v1";
const CACHE_TTL_MS = 15 * 60 * 1000; // 15 Minuten

let DATA = [];
let currentRange = "365";

function fmt(n, digits=1){
  if (n === null || n === undefined || isNaN(n)) return "–";
  return n.toLocaleString('de-CH', {minimumFractionDigits:digits, maximumFractionDigits:digits});
}

function readCache(){
  try{
    const raw = localStorage.getItem(CACHE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e){ return null; }
}
function writeCache(rows){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), rows })); }
  catch(e){ /* best effort */ }
}

const NUMERIC_COLS = ["Consumption_kWh","Production_kWh","GridFrom_kWh","GridTo_kWh","Entfeuchter_Waschen_kWh","Wasserpumpe_kWh","Ladestation_kWh"];

async function fetchFromApi(){
  const res = await fetch(API_URL, {cache:"no-store", credentials:"include"});
  if (!res.ok) throw new Error(`API HTTP ${res.status}`);
  const payload = await res.json();
  return (payload.data || []).map(row => {
    const obj = {...row};
    for (const key of NUMERIC_COLS){
      if (obj[key] !== null && obj[key] !== undefined) obj[key] = Number(obj[key]);
    }
    return obj;
  });
}

// ---------- Metrik-Aufbereitung (gleiche Spalten wie Index-Monatsuebersicht) ----------
const METRIC_COLS = [
  {key:'total', label:'Verbr. Total'},
  {key:'other', label:'Other'},
  {key:'ladestation', label:'Ladestation'},
  {key:'entfeuchter', label:'Entfeuchter'},
  {key:'wasserpumpe', label:'Wasserpumpe'},
  {key:'production', label:'Produktion'},
  {key:'toGrid', label:'toGrid'},
  {key:'fromGrid', label:'fromGrid'},
  {key:'eigen', label:'Eigenverbr.', percent:true},
];

function metricsFromRow(r){
  const total = r.Consumption_kWh || 0;
  const ladestation = r.Ladestation_kWh || 0;
  const entfeuchter = r.Entfeuchter_Waschen_kWh || 0;
  const wasserpumpe = r.Wasserpumpe_kWh || 0;
  const other = total - ladestation - entfeuchter - wasserpumpe;
  const production = r.Production_kWh || 0;
  const toGrid = r.GridTo_kWh || 0;
  const fromGrid = r.GridFrom_kWh || 0;
  const eigen = production > 0 ? (1 - toGrid/production) * 100 : null;
  return { total, other, ladestation, entfeuchter, wasserpumpe, production, toGrid, fromGrid, eigen };
}

function cellVal(metrics, col){
  const v = metrics[col.key];
  if (v === null || v === undefined) return "–";
  return col.percent ? `${fmt(v,1)}%` : fmt(v,1);
}

function applyData(rows, sourceLabel){
  DATA = rows.slice().sort((a,b)=> a.Date_ISO < b.Date_ISO ? -1 : 1);
  if (DATA.length === 0){
    document.getElementById('status').textContent = "Noch keine Daten vorhanden.";
    return false;
  }
  document.getElementById('status').style.display = 'none';
  document.getElementById('content').style.display = 'block';
  document.getElementById('subline').textContent =
    `${DATA[0].Date_Display} – ${DATA[DATA.length-1].Date_Display} · ${DATA.length} Tage`;
  document.getElementById('footerInfo').textContent = `Datenquelle: ${sourceLabel}`;
  renderTable();
  renderProductionChart();
  return true;
}

// ---------- Produktions-Chart (letzte 45 & nächste 15 Tage, je letzte 5 Jahre) ----------
const YEAR_COLORS = ['#E30613','#F0501A','#F58B00','#F9B800','#FFDE59']; // k=0 (aktuell/rot) ... k=4 (vor 4 Jahren/gelb)

function buildDataIndex(){
  const idx = new Map();
  DATA.forEach(r => idx.set(r.Date_ISO, r));
  return idx;
}

function isoFromUTC(ms){
  const dt = new Date(ms);
  const y = dt.getUTCFullYear();
  const m = String(dt.getUTCMonth()+1).padStart(2,'0');
  const d = String(dt.getUTCDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}

function zurichTodayISO(){
  const parts = new Intl.DateTimeFormat('en-CA', {timeZone:'Europe/Zurich', year:'numeric', month:'2-digit', day:'2-digit'}).formatToParts(new Date());
  const get = t => parts.find(p => p.type === t).value;
  return `${get('year')}-${get('month')}-${get('day')}`;
}

function renderProductionChart(){
  const svgEl = document.getElementById('prodChart');
  if (!svgEl) return;
  const idx = buildDataIndex();
  const todayISO = zurichTodayISO();
  const [ty, tm, td] = todayISO.split('-').map(Number);
  const baseUTC = Date.UTC(ty, tm - 1, td);

  const OFFSET_START = -29, OFFSET_END = 15; // 30 letzte (inkl. heute) + 15 naechste Tage = 45 Tage
  const groups = [];
  for (let off = OFFSET_START; off <= OFFSET_END; off++){
    const dISO = isoFromUTC(baseUTC + off * 86400000);
    const [gy, gm, gd] = dISO.split('-');
    const monthDay = `${gm}-${gd}`;
    const values = [];
    for (let k = 0; k < 5; k++){
      const targetYear = parseInt(gy, 10) - k;
      const targetISO = `${targetYear}-${monthDay}`;
      const row = idx.get(targetISO);
      const v = (row && row.Production_kWh !== null && row.Production_kWh !== undefined) ? Number(row.Production_kWh) : null;
      values.push({ v, iso: targetISO });
    }
    groups.push({ offset: off, dateISO: dISO, dayLabel: `${gd}.${gm}`, values });
  }

  let maxVal = 0;
  groups.forEach(g => g.values.forEach(({v}) => { if (v !== null && v > maxVal) maxVal = v; }));
  const niceMax = maxVal > 0 ? Math.ceil(maxVal / 5) * 5 : 1;

  const W = 1040, H = 260;
  const padL = 42, padR = 10, padT = 16, padB = 42;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;
  const n = groups.length;
  const groupW = plotW / n;
  const barGap = 0.5;
  const barW = Math.max(1, (groupW - barGap * 2) / 5);
  const yScale = v => padT + plotH - (v / niceMax) * plotH;

  let svg = '';

  const ySteps = 4;
  for (let s = 0; s <= ySteps; s++){
    const val = niceMax * s / ySteps;
    const y = yScale(val);
    svg += `<line x1="${padL}" y1="${y.toFixed(2)}" x2="${W - padR}" y2="${y.toFixed(2)}" stroke="#e8e8e8" stroke-width="1"/>`;
    svg += `<text x="${padL - 6}" y="${(y + 3).toFixed(2)}" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="9" fill="#8a8a8a">${fmt(val,0)}</text>`;
  }

  groups.forEach((g, gi) => {
    const gx = padL + gi * groupW;
    g.values.forEach(({v, iso}, k) => {
      if (v === null) return;
      const bx = gx + barGap + k * barW;
      const by = yScale(v);
      const bh = (padT + plotH) - by;
      const [iy, im, id] = iso.split('-');
      svg += `<rect class="prodBar" x="${bx.toFixed(2)}" y="${by.toFixed(2)}" width="${Math.max(barW - 0.3, 0.5).toFixed(2)}" height="${Math.max(bh,0).toFixed(2)}" fill="${YEAR_COLORS[k]}" data-date="${id}.${im}.${iy}" data-value="${fmt(v,1)} kWh"/>`;
    });
    if (gi % 5 === 0 || g.offset === 0){
      svg += `<text x="${(gx + groupW/2).toFixed(2)}" y="${H - padB + 12}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="8.5" fill="#8a8a8a">${g.dayLabel}</text>`;
    }
    if (g.offset === 0){
      svg += `<line x1="${gx.toFixed(2)}" y1="${padT}" x2="${gx.toFixed(2)}" y2="${(padT + plotH).toFixed(2)}" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="2,2"/>`;
      svg += `<text x="${gx.toFixed(2)}" y="${padT - 4}" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="600" fill="#1a1a1a">heute</text>`;
    }
  });

  svg += `<line x1="${padL}" y1="${(padT + plotH).toFixed(2)}" x2="${W - padR}" y2="${(padT + plotH).toFixed(2)}" stroke="#1a1a1a" stroke-width="1"/>`;

  svgEl.innerHTML = svg;
  attachProdChartTooltip(svgEl);

  const legendLabels = [0,1,2,3,4].map(k => String(ty - k));
  document.getElementById('prodChartLegend').innerHTML = legendLabels.map((lbl, k) =>
    `<span style="display:inline-flex; align-items:center; gap:5px;"><span style="width:10px; height:10px; background:${YEAR_COLORS[k]}; border-radius:2px; display:inline-block;"></span>${lbl}</span>`
  ).join('');
}

let prodChartTooltipBound = false;
function attachProdChartTooltip(svgEl){
  const tip = document.getElementById('prodChartTooltip');
  const wrap = svgEl.parentElement;
  if (!prodChartTooltipBound){
    svgEl.addEventListener('mouseover', e => {
      const rect = e.target.closest('.prodBar');
      if (!rect) return;
      tip.textContent = `${rect.dataset.date} · ${rect.dataset.value}`;
      tip.style.display = 'block';
    });
    svgEl.addEventListener('mousemove', e => {
      const rect = e.target.closest('.prodBar');
      if (!rect) return;
      const wrapBox = wrap.getBoundingClientRect();
      tip.style.left = `${e.clientX - wrapBox.left}px`;
      tip.style.top = `${e.clientY - wrapBox.top - 8}px`;
    });
    svgEl.addEventListener('mouseout', e => {
      const rect = e.target.closest('.prodBar');
      if (!rect) return;
      tip.style.display = 'none';
    });
    prodChartTooltipBound = true;
  }
}

async function load(){
  const cached = readCache();
  let shownFromCache = false;
  if (cached && cached.rows && cached.rows.length){
    applyData(cached.rows, `Cache · ${new Date(cached.ts).toLocaleTimeString('de-CH')}`);
    shownFromCache = true;
  }

  const isFresh = cached && (Date.now() - cached.ts < CACHE_TTL_MS);
  if (isFresh) return;

  try{
    const rows = await fetchFromApi();
    if (rows.length === 0) throw new Error("Keine Daten von der API erhalten");
    writeCache(rows);
    applyData(rows, "energymanager-api (live)");
  } catch(e){
    console.warn("API-Zugriff fehlgeschlagen:", e);
    if (!shownFromCache){
      document.getElementById('status').textContent = `Fehler beim Laden: ${e.message}`;
    } else {
      const footer = document.getElementById('footerInfo');
      footer.textContent += " · Live-Update fehlgeschlagen, zeige Cache";
    }
  }
}

// ---------- Range tabs (bestimmen die Tabellenlaenge) ----------
document.getElementById('rangeTabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  currentRange = tab.dataset.range;
  document.querySelectorAll('#rangeTabs .tab').forEach(b => b.classList.toggle('active', b === tab));
  if (DATA.length) renderTable();
});

function renderTable(){
  const n = parseInt(currentRange, 10);
  const rows = DATA.slice(-n).slice().reverse(); // neuster Tag zuoberst
  const head = `<thead><tr><th>Datum</th>${METRIC_COLS.map(c=>`<th>${c.label}</th>`).join('')}</tr></thead>`;
  const body = `<tbody>${rows.map(r => {
    const metrics = metricsFromRow(r);
    return `<tr><td>${r.Date_Display}</td>${METRIC_COLS.map(c=>`<td>${cellVal(metrics,c)}</td>`).join('')}</tr>`;
  }).join('')}</tbody>`;
  document.getElementById('dailyTable').innerHTML = head + body;
}

load();
</script>
  <script src="https://munotstadt.github.io/db_admin/assets/improvements-button.js" data-app="energymanager" data-position="left"></script>
</body>
</html>
